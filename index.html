<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>CitiTool · SyncOperator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="styleheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <!-- HEADER -->
      <header class="app-header">
        <div class="app-header-left">
          <!-- Новый премиум-логотип CT, без Sync -->
          <div class="app-logo-premium">
            <span>CT</span>
          </div>

          <div class="app-title-block">
            <div class="app-title-row">
              <div class="app-title">CITITOOL</div>
            </div>
            <div class="app-subtitle">
              SyncOperator Modul · Kanal / Spindel Planung
            </div>
          </div>
        </div>

        <div class="app-header-right">
          <div class="app-meta">
            <div class="app-meta-label">PROJEKT</div>
            <div class="app-meta-value" id="projectName">WORKPIECE_1A</div>
          </div>
        </div>
      </header>

      <!-- MAIN LAYOUT -->
      <main class="layout-main">
        <!-- PROGRAMMPLAN -->
        <section class="card slots-card">
          <div class="section-header">
            <div>
              <div class="section-title">PROGRAMMPLAN</div>
            </div>
          </div>

          <div class="kanal-switcher-wrapper">
            <div id="kanalSwitcher" class="kanal-switcher">
              <button
                type="button"
                class="kanal-option active"
                data-kanal="1"
              >
                <span class="kanal-label">Kanal 1</span>
                <span class="kanal-chip">1000.MPF</span>
              </button>
              <button
                type="button"
                class="kanal-option"
                data-kanal="2"
              >
                <span class="kanal-label">Kanal 2</span>
                <span class="kanal-chip">2000.MPF</span>
              </button>
            </div>
          </div>

          <div id="kanalHint" class="kanal-hint">
            Revolver oben · Kanal 1
          </div>

          <div id="slotList" class="slot-list"></div>

          <button
            id="addSlotBtn"
            type="button"
            class="btn-outline add-slot-btn"
          >
            <span class="btn-icon">+</span>
            <span>Weitere Zeile</span>
          </button>
        </section>

        <!-- OPERATION LIBRARY -->
        <section class="card library-card">
          <div class="section-header">
            <div>
              <div class="section-title">OPERATION LIBRARY</div>
              <div class="section-subtitle">
                Klick für Editor · Drag &amp; Drop in Slots
              </div>
            </div>
            <div class="section-actions">
              <button
                id="infoButton"
                class="icon-button subtle"
                type="button"
                aria-label="Info"
              >
                <span class="icon-circle">i</span>
              </button>
            </div>
          </div>

          <div id="libraryFilters" class="library-filters"></div>

          <div id="libraryList" class="library-list"></div>

          <div class="library-add">
            <button
              id="addOpButton"
              type="button"
              class="btn-primary"
            >
              <span class="btn-icon">+</span>
              <span>Op hinzufügen</span>
            </button>
          </div>
        </section>
      </main>

      <!-- PLAN – KANAL / SPINDEL -->
      <section class="card plan-card">
        <div class="section-header">
          <div>
            <div class="section-title">PLAN – KANAL / SPINDEL</div>
            <div class="section-subtitle">
              Kanal 1/2 · Spindel 3/4 · Reihenfolge 1…N
            </div>
          </div>
          <div class="section-actions">
            <!-- Переключатель Programmplan / Einrichteblatt добавляется JS-ом -->
            <button
              id="importJsonBtn"
              type="button"
              class="btn-outline btn-small"
            >
              JSON Import
            </button>
            <button
              id="exportJsonBtn"
              type="button"
              class="btn-outline btn-small"
            >
              JSON Export
            </button>
            <button
              id="exportPdfBtn"
              type="button"
              class="btn-outline btn-small"
            >
              → Als PDF
            </button>
          </div>
        </div>

        <div class="plan-table-wrapper">
          <table id="planTable" class="plan-table"></table>
        </div>
      </section>
    </div>

    <!-- HIDDEN FILE INPUT FOR JSON IMPORT -->
    <input
      type="file"
      id="importFileInput"
      accept="application/json"
      style="display:none"
    />

    <!-- MODAL -->
    <div
      id="modalOverlay"
      class="modal-overlay"
      aria-hidden="true"
    >
      <div class="modal-backdrop"></div>
      <div class="modal-dialog" role="dialog" aria-modal="true">
        <div class="modal-header">
          <div class="modal-icon">
            <div class="modal-icon-circle">i</div>
          </div>
          <div class="modal-header-text">
            <div id="modalTitle" class="modal-title"></div>
            <div
              id="modalDescription"
              class="modal-description"
            ></div>
          </div>
          <button
            id="modalCloseButton"
            type="button"
            class="icon-button"
            aria-label="Schließen"
          >
            ✕
          </button>
        </div>
        <div id="modalBody" class="modal-body"></div>
        <div id="modalFooter" class="modal-footer"></div>
      </div>
    </div>

    <!-- SVG ICONS -->
    <svg width="0" height="0" style="position:absolute;visibility:hidden">
      <symbol id="icon-trash" viewBox="0 0 24 24">
        <path
          d="M9 3h6a1 1 0 0 1 .99.86L16 4h4a1 1 0 1 1 0 2h-1.1l-1.2 13.2A2 2 0 0 1 15.71 21H8.29a2 2 0 0 1-1.99-1.8L5.1 6H4a1 1 0 1 1 0-2h4l.01-.14A1 1 0 0 1 9 3zm6.9 3H8.1l1.1 13h5.6l1.1-13zM10 8a1 1 0 0 1 1 1v7a1 1 0 1 1-2 0V9a1 1 0 0 1 1-1zm4 0a1 1 0 0 1 1 1v7a1 1 0 1 1-2 0V9a1 1 0 0 1 1-1z"
        />
      </symbol>
    </svg>

    <script src="app.js"></script>
  </body>
</html>
